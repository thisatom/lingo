name: Release builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libsecret-1-dev

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test

      - name: Install Playwright browser
        run: npm run test:e2e:install -- --with-deps

      - name: E2E tests (web preview)
        run: npm run test:e2e

      - name: TypeScript
        run: npm run typecheck

      - name: Production build (Electron)
        run: npm run build

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libsecret-1-dev

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Package (${{ matrix.platform }})
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --${{ matrix.platform }} --publish never
        shell: bash

      - name: List packaged files
        run: ls -lah release/
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lingo-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: lingo-win
          path: release-artifacts/win

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: lingo-linux
          path: release-artifacts/linux

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: lingo-mac
          path: release-artifacts/mac

      - name: Prepare release assets
        run: |
          mkdir -p release-upload
          find release-artifacts -type f \
            \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \
               -o -name '*.dmg' -o -name '*.zip' -o -name '*.tar.gz' \) \
            -exec cp -v {} release-upload/ \;
          echo "Assets to publish:"
          ls -lh release-upload/
          test "$(find release-upload -type f | wc -l)" -gt 0

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Lingo ${{ github.ref_name }}
          files: release-upload/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
