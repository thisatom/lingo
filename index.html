<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP: vite/inject-csp overwrites at dev/build; fallback = electron production policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://www.google.com https://*.google.com https://speech.googleapis.com wss://www.google.com wss://*.google.com; media-src 'self' blob: data: file:" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121212" />
    <meta name="msapplication-TileColor" content="#121212" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <title>Lingo</title>
    <script src="/init-theme.js"></script>
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background-color: #121212;
        color: #d1d1d1;
      }
      html:not(.dark) body,
      html:not(.dark) #root {
        background-color: #f4f4f5;
        color: #18181b;
      }
      #root {
        min-height: 100%;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        background: #121212;
      }
      html:not(.dark) #app-splash {
        background: #f4f4f5;
      }
      #app-splash.app-splash--hide {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.22s ease-out;
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-busy="true" aria-label="Loading"></div>
    <div id="root"></div>
    <script type="module" src="/src/boot.tsx"></script>
  </body>
</html>
